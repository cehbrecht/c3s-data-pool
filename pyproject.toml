[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c3s-data-pool"
version = "0.1.0"
description = "Build and verify local hardlink data pools from CSV catalogs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
lint = ["ruff==0.14.13"]

[project.scripts]
c3s-data-pool = "c3s_data_pool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".conda-env", ".conda-envs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
